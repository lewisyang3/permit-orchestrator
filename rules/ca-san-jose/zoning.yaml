# Sourced San José residential starter checks; see README.md for scope.
schema_version: "0.2.0"
jurisdiction_id: "ca-san-jose"
rule_set_id: "san-jose-zoning-residential-starter"
version: "0.2.0"
department: "zoning"
status: "sourced_partial_rule_set"
scope:
  jurisdiction: "San José city jurisdiction, California"
  project_category: "Conventional single-family primary dwellings: new work and affected elements of additions or alterations."
  code_basis: "2025 California codes as described in city guidance; verify the project uses this code cycle."
  excluded:
    - "commercial_or_assembly"
    - "multifamily"
    - "ADU_or_JADU"
    - "SB9_or_other_special_housing_pathway"
    - "Planned_Development"
    - "historic_or_alternative_design_pathway"
  existing_unchanged_elements: "Do not infer a retrofit obligation from these new-work dimensions. Establish the applicable alteration requirements first."
  on_unsupported_project: "REQUIRES_HUMAN_REVIEW"
evaluation_policy:
  instructions: "Determine applicability from evidence, select one requirement case, then compare every check. Cite both the requirement and project evidence in each finding."
  allow_model_to_invent_thresholds: false
  outcomes:
    - "PASS"
    - "FAIL"
    - "NOT_APPLICABLE"
    - "NEEDS_INFORMATION"
    - "REQUIRES_HUMAN_REVIEW"
  unknown_applicability: "NEEDS_INFORMATION"
  unknown_exception: "REQUIRES_HUMAN_REVIEW"
  no_matching_or_multiple_matching_cases: "REQUIRES_HUMAN_REVIEW"
  missing_check_field: "NEEDS_INFORMATION"
  not_applicable_requires_evidence: true
  empty_collection_is_pass: false
  coverage: "Individual checks only. Passing these checks does not complete department review."
  allow_final_department_approval_from_this_pack_alone: false
  contract_mapping: "Internal unresolved outcomes need a coordinated contract update; never silently convert them to APPROVED or a verified violation."
input_convention: "Facts are normalized evidence for each relevant object, not new fields already present in contract/models.py. Evaluate all affected objects separately; keep document/page references."
known_coverage_gaps:
  - "Permitted use and General Plan consistency"
  - "Complete zoning exceptions and overlays"
  - "Floor-area ratio and permit pathways"
  - "Lot subdivision standards"
  - "Site-specific approvals and restrictions"
rules:
  -
    rule_id: "SJ-Z-101"
    rule_name: "Primary dwelling front setback"
    status: "sourced_starter_check"
    evaluation_enabled: true
    description: "Compare the measured setback with the district baseline after resolving exceptions."
    applies_when:
      -
        field: "zone_code"
        operator: "in"
        value:
          - "R-1-8"
          - "R-1-5"
          - "R-1-2"
          - "R-1-1"
          - "R-1-RR"
    prerequisites:
      - "Project is within the declared pack scope."
      - "Applicability and any claimed exception are supported by project evidence."
    requirement:
      cases:
        -
          when:
            -
              field: "zone_code"
              operator: "eq"
              value: "R-1-8"
          checks:
            -
              field: "front_setback_ft"
              operator: "gte"
              value: 20
              unit: "ft"
        -
          when:
            -
              field: "zone_code"
              operator: "eq"
              value: "R-1-5"
          checks:
            -
              field: "front_setback_ft"
              operator: "gte"
              value: 20
              unit: "ft"
        -
          when:
            -
              field: "zone_code"
              operator: "eq"
              value: "R-1-2"
          checks:
            -
              field: "front_setback_ft"
              operator: "gte"
              value: 30
              unit: "ft"
        -
          when:
            -
              field: "zone_code"
              operator: "eq"
              value: "R-1-1"
          checks:
            -
              field: "front_setback_ft"
              operator: "gte"
              value: 30
              unit: "ft"
        -
          when:
            -
              field: "zone_code"
              operator: "eq"
              value: "R-1-RR"
          checks:
            -
              field: "front_setback_ft"
              operator: "gte"
              value: 50
              unit: "ft"
      combine_checks: "all"
      case_selection: "exactly_one"
    source:
      -
        url: "https://www.sanjoseca.gov/home/showpublisheddocument/94721/638511967421800000"
        section: "Residential Zoning Districts Development Standards; SJMC 20.30.200, Table 20-60"
        source_type: "city_published_guidance"
        retrieval: "full_document"
        checked_on: "2026-11-14"
        printed_page: 19
    exceptions_and_limits:
      - "Baseline primary-building standard only; resolve parcel-specific approvals, nonconforming rights, easements, overlays, and applicable zoning exceptions first."
      - "Potential exceptions include block-average front setbacks, older narrow/shallow lots, additions, and abutting alleys. A claimed or unknown exception requires review before a violation is declared."
      - "Generic R-1 is insufficient: identify the actual mapped district. These values do not govern ADUs, SB 9, or PD projects."
    on_missing_evidence: "NEEDS_INFORMATION"
    on_unresolved_exception: "REQUIRES_HUMAN_REVIEW"
    examples:
      -
        facts:
          zone_code: "R-1-8"
          front_setback_ft: 20
        expected_outcome: "PASS"
      -
        facts:
          zone_code: "R-1-8"
          front_setback_ft: 19.99
        expected_outcome: "FAIL"
